---
# Workflow (all commands take: -i CROWDIN_PROJECT_ID -T CROWDIN_TOKEN)
#
# A) You added/edited source strings in values/ (English):
#      crowdin upload sources
#    New keys appear untranslated on Crowdin; existing translations are untouched.
#    If you also hand-wrote translations in values-xx/ locally, push them BEFORE
#    the next download or they will be overwritten by it:
#      crowdin upload translations
#    (safe: adds them as unapproved suggestions, skips identical ones, never
#    deletes or un-approves the community's work)
#
# B) New community translations arrived on Crowdin:
#      crowdin download
#      python3 scripts/replace_escaped_apostrophes.py   # fix \' and \" artifacts
#      git diff   # review, then commit
#
# If both drifted apart: do A first, then B.
#
# Notes:
# - Never run only a local edit of values-xx/ files — without an upload, the
#   next crowdin download silently reverts it.
# - "Translation file ... is missing in the project" warnings on download are
#   harmless: that language has nothing translated yet for that file.
# - Do NOT unescape apostrophes in shared/src/androidMain/res (aapt needs \').

languages_mapping: &languages_mapping
  android_code:
    ar: "ar"
    bn: "bn"
    bs: "bs"
    ca: "ca"
    cs: "cs"
    da: "da"
    de: "de"
    el: "el"
    eu: "eu"
    fa: "fa"
    fi: "fi"
    fr: "fr"
    gl: "gl"
    he: "iw"
    hi: "hi"
    hr: "hr"
    hu: "hu"
    id: "in"
    it: "it"
    ja: "ja"
    ko: "ko"
    lt: "lt"
    lv: "lv"
    nl: "nl"
    "no": "no"
    pl: "pl"
    ro: "ro"
    ru: "ru"
    sk: "sk"
    sl: "sl"
    th: "th"
    tr: "tr"
    uk: "uk"
    vi: "vi"
    es-ES: "es"
    pt-PT: "pt"
    sv-SE: "sv"
    es-AR: "es-rAR"
    pt-BR: "pt-rBR"
    sr-CS: "sr-rCS"
    zh-CN: "zh-rCN"
    zh-TW: "zh-rTW"

files:
  # Compose Multiplatform resources (commonMain)
  - source: "shared/src/commonMain/composeResources/values/strings_main.xml"
    translation: "shared/src/commonMain/composeResources/values-%android_code%/%original_file_name%"
    languages_mapping: *languages_mapping
    labels:
      - main
  - source: "shared/src/commonMain/composeResources/values/strings_about.xml"
    translation: "shared/src/commonMain/composeResources/values-%android_code%/%original_file_name%"
    languages_mapping: *languages_mapping
