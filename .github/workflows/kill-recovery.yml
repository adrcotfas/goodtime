name: Kill-recovery tests

# On-demand only: these are slow (each expiry case waits ~1 minute for a real countdown)
# and need an emulator, so they don't belong on every push/PR. Trigger from the Actions tab.
on:
  workflow_dispatch:

jobs:
  kill-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # hardware acceleration for the emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run kill-recovery tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :appKillTest:connectedGoogleDebugAndroidTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kill-recovery-report
          path: appKillTest/build/reports/androidTests/
          if-no-files-found: ignore
