name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Check Android + Spotless
        run: ./gradlew :shared:testAndroidHostTest :androidApp:check spotlessCheck

  ios:
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test iOS (simulator)
        # cacheKind=none works around KT-86501 (klib cache builder crashes on the
        # kotlinx.datetime Clock/Instant typealias); fixed in Kotlin 2.4.10, drop then.
        run: ./gradlew :shared:iosSimulatorArm64Test -Pkotlin.native.cacheKind.iosSimulatorArm64=none
